name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVLL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: ./build/voice-leading-lab --smoke-test
      - name: MIDI smoke test
        run: ./build/voice-leading-lab --midi-smoke
      - name: Audio smoke test
        run: ./build/voice-leading-lab --audio-smoke
      - name: Visualizer smoke test
        run: ./build/voice-leading-lab --visualizer-smoke
      - name: Notation smoke test
        run: ./build/voice-leading-lab --notation-smoke
      - name: Feedback smoke test
        run: ./build/voice-leading-lab --feedback-smoke
      - name: Fundamental course smoke test
        run: ./build/voice-leading-lab --course-smoke
      - name: Exercise generator smoke test
        run: ./build/voice-leading-lab --generator-smoke
      - name: Book integration smoke test
        run: ./build/voice-leading-lab --book-smoke
      - name: Instrument harmonization and lab smoke test
        run: ./build/voice-leading-lab --phase-10-12-smoke
      - name: Barry Harris and ear training smoke test
        run: ./build/voice-leading-lab --phase-13-15-smoke
      - name: Analysis practice and tutor smoke test
        run: ./build/voice-leading-lab --phase-16-18-smoke
      - name: Release smoke test
        run: ./build/voice-leading-lab --release-smoke
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test Android Kotlin core
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build Galaxy Tab APK
        run: ./gradlew :app:assembleDebug --stacktrace
